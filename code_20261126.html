    <style>
        * {
            font-family: 'Noto Serif SC', serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5efe6 0%, #e8dfd2 100%);
            min-height: 100vh;
        }
        
        .bg-pattern {
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(201, 169, 98, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(194, 58, 48, 0.06) 0%, transparent 50%);
        }
        
        .card-shadow {
            box-shadow: 0 10px 40px rgba(44, 24, 16, 0.12), 0 2px 8px rgba(44, 24, 16, 0.08);
        }
        
        .option-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(201, 169, 98, 0.3);
        }
        
        .option-card:hover {
            transform: translateY(-2px);
            border-color: #c9a962;
            background: rgba(201, 169, 98, 0.08);
        }
        
        .option-card:active {
            transform: translateY(0);
        }
        
        .option-card.selected {
            border-color: #c23a30;
            background: rgba(194, 58, 48, 0.06);
        }
        
        .fade-enter {
            opacity: 0;
            transform: translateX(20px);
        }
        
        .fade-enter-active {
            opacity: 1;
            transform: translateX(0);
            transition: all 0.4s ease-out;
        }
        
        .fade-exit {
            opacity: 1;
            transform: translateX(0);
        }
        
        .fade-exit-active {
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.3s ease-in;
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #c23a30, #c9a962);
            transition: width 0.5s ease-out;
        }
        
        .result-card {
            background: linear-gradient(145deg, #f5efe6 0%, #ebe2d3 100%);
        }
        
        .title-decoration::before,
        .title-decoration::after {
            content: '——';
            color: #c9a962;
            margin: 0 0.5em;
        }
        
        .ink-border {
            border: 1px solid rgba(44, 24, 16, 0.15);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #c23a30 0%, #a02d25 100%);

        }
        
        .btn-primary:hover {
            transform: translateY(-1px);

        }
        
        .btn-secondary {
            border: 1px solid #c9a962;
            color: #8b6914;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background: rgba(201, 169, 98, 0.15);
        }
        
        .dimension-bar {
            height: 6px;
            border-radius: 3px;
            background: rgba(44, 24, 16, 0.1);
            overflow: hidden;
        }
        
        .dimension-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 1s ease-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }

            font-style: italic;
            color: #5b7c6e;
            position: relative;
            padding-left: 1em;
            border-left: 3px solid #c9a962;
        }

</head>
